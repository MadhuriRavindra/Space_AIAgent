# Push a tag like v2.1.0 -> checks the version number matches the code,
# then creates a GitHub Release with the notes from CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match cosmo/__init__.py version
        run: |
          CODE_VERSION=$(python -c "import cosmo; print(cosmo.__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "code=$CODE_VERSION tag=$TAG_VERSION"
          if [ "$CODE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match code version $CODE_VERSION"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Space Explorer $GITHUB_REF_NAME" --notes-file notes.md
