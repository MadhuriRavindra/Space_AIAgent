# Emergency rollback: Actions tab -> "Rollback production" -> Run workflow -> enter a tag (e.g. v1.1.0).
# Moves the `release` branch back to that version; Streamlit Cloud redeploys it in about a minute.
name: Rollback production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to roll back to (e.g. v1.1.0)"
        required: true
      reason:
        description: "Why are we rolling back?"
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point release branch at ${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
        run: |
          git rev-parse --verify "refs/tags/$TAG" >/dev/null || { echo "::error::Tag $TAG not found"; exit 1; }
          git push --force origin "refs/tags/$TAG^{commit}:refs/heads/release"
          {
            echo "## ⏪ Rolled back production to \`$TAG\`"
            echo ""
            echo "**Reason:** $REASON"
            echo ""
            echo "Next: fix the problem on \`main\`. The normal pipeline promotes the fix when all gates pass."
          } >> "$GITHUB_STEP_SUMMARY"
